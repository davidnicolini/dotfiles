name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  matrix-check:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [archlinux:latest, debian:trixie, fedora:latest]
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install dependencies
        run: |
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm bash git; fi
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y bash git; fi
          if command -v dnf >/dev/null; then dnf install -y bash git; fi
      - uses: actions/checkout@v4
      - name: Verify script syntax and OS detection
        run: |
          bash -n install.sh scripts/*.sh
          source scripts/detect_os.sh
          echo "Detected: $OS_NAME ($PKG_MANAGER)"
